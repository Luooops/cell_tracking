<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handover Review</title>
<style>
  :root { --ink:#222; --muted:#666; --line:#ddd; --bg:#fafafa; --card:#fff; --accent:#1e88e5;
          --same:#43a047; --none:#9e9e9e; --unsure:#fb8c00; --conflict:#e53935; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line); padding:8px 16px;
           display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  .bar { flex:1 1 200px; height:8px; background:#eee; border-radius:4px; overflow:hidden; min-width:120px; }
  .bar > div { height:100%; background:var(--accent); width:0; }
  button, select, input { font:inherit; }
  button { border:1px solid var(--line); background:var(--card); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { outline:2px solid var(--accent); }
  main { padding:12px 16px; max-width:1500px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .meta { color:var(--muted); margin-bottom:8px; }
  .panel { overflow-x:auto; margin:8px 0; }
  .panel img { display:block; max-width:none; image-rendering:auto; }
  .choices { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .choices button { padding:8px 12px; }
  .choices .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .status { font-weight:600; }
  textarea { width:100%; min-height:44px; font:inherit; border:1px solid var(--line); border-radius:6px; padding:6px; }
  .nav { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .help { color:var(--muted); font-size:12px; margin-top:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; margin-top:12px; }
  .chip { width:12px; height:12px; border-radius:2px; background:#e0e0e0; cursor:pointer; border:1px solid transparent; }
  .chip.same { background:var(--same); } .chip.none { background:var(--none); } .chip.unsure { background:var(--unsure); }
  .chip.conflict { background:var(--conflict); } .chip.cur { border-color:#000; }
  .warn { color:var(--conflict); font-weight:600; }
  @media (max-width:700px) { header { padding:8px; } main { padding:8px; } }
</style>
</head>
<body>
<header>
  <h1>标注换号审阅</h1>
  <span id="count"></span>
  <div class="bar"><div id="progress"></div></div>
  <label>显示 <select id="filter">
    <option value="all">全部</option><option value="undecided">未审</option><option value="same">同一细胞</option>
    <option value="none">都不是</option><option value="unsure">不确定</option><option value="conflict">冲突</option>
  </select></label>
  <label><input type="checkbox" id="auto" checked> 作答后自动下一个</label>
  <button id="export">导出 decisions.json</button>
  <label><button id="importBtn" type="button">导入</button><input type="file" id="import" accept=".json" hidden></label>
</header>
<main>
  <div class="card">
    <div class="meta" id="meta"></div>
    <div class="panel"><img id="panel" alt="panel"></div>
    <div>红色 <b>A</b> = 在 t 帧结束的轨迹；彩色 <b>1, 2, …</b> = 在附近开始的轨迹。A 和哪一个是同一个细胞？</div>
    <div class="choices" id="choices"></div>
    <div>当前判断：<span class="status" id="status"></span> <span class="warn" id="conflict"></span></div>
    <div style="margin-top:8px"><textarea id="note" placeholder="备注（可选）"></textarea></div>
    <div class="nav">
      <button id="prev">← 上一个</button><button id="next">下一个 →</button>
      <span>跳到 <input id="jump" type="number" min="1" style="width:80px"></span>
      <span id="pos"></span>
    </div>
    <div class="help">键盘：1–9 选对应起点（同一细胞）· 0 都不是 · u 不确定 · Backspace 清除 · ←/→ 翻页。进度自动保存在本浏览器中；换浏览器或电脑请先导出再导入。</div>
    <div class="chips" id="chips"></div>
  </div>
</main>
<script id="review-data" type="application/json">/*__REVIEW_DATA__*/</script>
<script>
(function () {
  const review = JSON.parse(document.getElementById('review-data').textContent);
  const items = review.items, KEY = 'handover-review-' + review.review_id;
  const COLORS = ['#1e88e5', '#43a047', '#fb8c00', '#8e24aa', '#00acc1', '#d81b60'];
  let decisions = {};
  try { decisions = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { decisions = {}; }
  let idx = 0;
  const $ = id => document.getElementById(id);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(decisions)); } catch (e) {} };
  const choiceOf = it => (decisions[it.id] || {}).choice;

  function conflicts() {           // one start claimed by two ends
    const claimed = {}, bad = new Set();
    for (const it of items) {
      const c = choiceOf(it);
      if (typeof c === 'number') { const k = it.well + ':' + c; (claimed[k] = claimed[k] || []).push(it.id); }
    }
    for (const ids of Object.values(claimed)) if (ids.length > 1) ids.forEach(i => bad.add(i));
    return bad;
  }
  function statusOf(it, bad) {
    const c = choiceOf(it);
    if (bad.has(it.id)) return 'conflict';
    if (c === undefined || c === null) return 'undecided';
    return typeof c === 'number' ? 'same' : c;
  }
  function visible() {
    const f = $('filter').value, bad = conflicts();
    return items.map((it, i) => i).filter(i => f === 'all' || statusOf(items[i], bad) === f);
  }
  function setChoice(choice) {
    const it = items[idx], d = decisions[it.id] || {};
    if (choice === null) delete d.choice; else d.choice = choice;
    d.time = new Date().toISOString();
    decisions[it.id] = d; save(); render();
    if (choice !== null && $('auto').checked) step(1);
  }
  function step(dir) {
    const vis = visible();
    if (!vis.length) return;
    let p = vis.indexOf(idx);
    p = p < 0 ? vis.findIndex(i => i > idx) : p + dir;
    if (p < 0) p = 0;
    if (p >= vis.length) p = vis.length - 1;
    idx = vis[p] === undefined ? vis[0] : vis[p];
    render();
  }
  function render() {
    const it = items[idx], bad = conflicts(), c = choiceOf(it);
    $('meta').textContent = `孔板 ${it.well} · 轨迹 A = ${it.a_label} 在第 ${it.a_frame} 帧结束 · 门控半径 ${it.radius} px`;
    $('panel').src = it.panel;
    const box = $('choices'); box.innerHTML = '';
    it.starts.forEach((s, k) => {
      const b = document.createElement('button');
      b.innerHTML = `<span class="sw" style="background:${COLORS[k % COLORS.length]}"></span>${k + 1}：轨迹 ${s.b_label}（第 ${s.b_frame} 帧开始，隔 ${s.g} 帧，距离 ${s.distance} px）`;
      if (c === s.b_label) b.classList.add('on');
      b.onclick = () => setChoice(s.b_label); box.appendChild(b);
    });
    for (const [label, val] of [['0：都不是', 'none'], ['u：不确定', 'unsure']]) {
      const b = document.createElement('button'); b.textContent = label;
      if (c === val) b.classList.add('on');
      b.onclick = () => setChoice(val); box.appendChild(b);
    }
    const names = { none: '都不是', unsure: '不确定' };
    $('status').textContent = c === undefined ? '未审' : (typeof c === 'number' ? `A 与轨迹 ${c} 是同一细胞` : names[c]);
    $('conflict').textContent = bad.has(it.id) ? '冲突：这个起点也被另一个终点选中了' : '';
    $('note').value = (decisions[it.id] || {}).note || '';
    $('pos').textContent = `第 ${idx + 1} / ${items.length} 个`;
    const done = items.filter(x => choiceOf(x) !== undefined).length;
    $('count').textContent = `已审 ${done} / ${items.length}` + (bad.size ? ` · 冲突 ${bad.size}` : '');
    $('progress').style.width = (100 * done / items.length) + '%';
    const chips = $('chips'); chips.innerHTML = '';
    items.forEach((x, i) => {
      const ch = document.createElement('div');
      ch.className = 'chip ' + statusOf(x, bad) + (i === idx ? ' cur' : '');
      ch.title = `${i + 1}: ${x.id}`; ch.onclick = () => { idx = i; render(); };
      chips.appendChild(ch);
    });
  }
  $('note').addEventListener('input', e => {
    const it = items[idx]; decisions[it.id] = Object.assign(decisions[it.id] || {}, { note: e.target.value }); save();
  });
  $('prev').onclick = () => step(-1);
  $('next').onclick = () => step(1);
  $('filter').onchange = () => step(0);
  $('jump').onchange = e => { const n = parseInt(e.target.value, 10); if (n >= 1 && n <= items.length) { idx = n - 1; render(); } };
  $('export').onclick = () => {
    const out = { review_id: review.review_id, dataset: review.dataset, exported: new Date().toISOString(), decisions };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
    a.download = 'decisions.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  $('importBtn').onclick = () => $('import').click();
  $('import').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      const data = JSON.parse(t);
      if (data.review_id !== review.review_id) { alert('这个文件来自另一次审阅（review_id 不一致），未导入。'); return; }
      decisions = Object.assign(decisions, data.decisions || {}); save(); render();
    });
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    const it = items[idx];
    if (/^[1-9]$/.test(e.key) && it.starts[+e.key - 1]) setChoice(it.starts[+e.key - 1].b_label);
    else if (e.key === '0') setChoice('none');
    else if (e.key === 'u' || e.key === 'U') setChoice('unsure');
    else if (e.key === 'Backspace') { e.preventDefault(); setChoice(null); }
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });
  const firstOpen = items.findIndex(it => choiceOf(it) === undefined);
  idx = firstOpen < 0 ? 0 : firstOpen;
  render();
})();
</script>
</body>
</html>
